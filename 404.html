<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="Page Not Found - Youth STEAM Initiative" />
    <meta name="author" content="" />
    <title>404 - Page Not Found</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2" />
    <!-- Bootstrap Icons-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Google fonts-->
    <link
      href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/about.css" rel="stylesheet" />
    
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      main {
        flex: 1;
      }

      .error-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 60px 20px;
        min-height: calc(100vh - 200px);
      }

      .error-code {
        font-size: 120px;
        margin-top:100px;
        font-weight: 700;
        color: #f4623a;
        line-height: 1;
        margin-bottom: 20px;
      }

      .error-title {
        font-size: 48px;
        font-weight: 700;
        color: #212529;
        margin-bottom: 20px;
      }

      .error-description {
        font-size: 20px;
        color: #6c757d;
        margin-bottom: 40px;
        max-width: 600px;
        line-height: 1.6;
      }

      .error-icon {
        font-size: 100px;
        color: #f4623a;
        margin-bottom: 30px;
        opacity: 0.8;
      }

      .btn-back-home {
        display: inline-block;
        padding: 12px 40px;
        font-size: 18px;
        font-weight: 600;
        color: white;
        background-color: #f4623a;
        text-decoration: none;
        border-radius: 5px;
        transition: background-color 0.3s ease, transform 0.2s ease;
        margin: 10px;
      }

      .btn-back-home:hover {
        background-color: #d94a2a;
        transform: translateY(-2px);
        color: white;
      }

      .btn-back-home.secondary {
        background-color: #6c757d;
        margin-left: 10px;
      }

      .btn-back-home.secondary:hover {
        background-color: #5a6268;
      }

      .divider {
        width: 100px;
        height: 4px;
        background-color: #f4623a;
        margin: 30px auto;
        border-radius: 2px;
      }

      @media (max-width: 768px) {
        .error-code {
          font-size: 80px;
        }

        .error-title {
          font-size: 32px;
        }

        .error-description {
          font-size: 16px;
        }

        .error-icon {
          font-size: 70px;
        }

        .btn-back-home {
          display: block;
          margin: 10px auto;
        }

        .btn-back-home.secondary {
          margin-left: auto;
          margin-right: auto;
        }
      }
    </style>
  </head>

  <body id="page-top">
    <nav-component></nav-component>

    <main>
      <section class="error-container">
        
        <div class="error-code">404</div>
        
        <h1 class="error-title">Page Not Found</h1>
        
        <div class="divider"></div>
        
        <p class="error-description">
          Oops! The page you're looking for doesn't exist or may have been moved.
        </p>

        <div>
          <a href="index.html" class="btn-back-home">
            <i class="bi bi-house-fill me-2"></i>Back to Home
          </a>
        </div>
      </section>
    </main>

    <footer-component></footer-component>

    <!-- Bootstrap bundle JS-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <!-- Load components-->
    <script src="components/nav-component.js"></script>
    <script src="components/footer-component.js"></script>
  </body>
</html>
