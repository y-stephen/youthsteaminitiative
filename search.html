<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Search the Youth STEAM Initiative website." />
    <title>Search | Youth STEAM Initiative</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2" />
    <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/search.css" rel="stylesheet" />
  </head>
  <body id="page-top">
    <nav-component></nav-component>
    <main class="search-page container">
      <h1>Search the site</h1>
      <p>Find projects, activities, resources, and more by the Youth STEAM Initiative.</p>
      <form id="search-form" role="search" action="search.html">
        <label for="search-query">Search terms</label>
        <div class="search-controls">
          <input id="search-query" name="q" type="search" placeholder="What are you looking for?" required />
          <button type="submit">Search</button>
        </div>
      </form>
      <p id="search-status" role="status" aria-live="polite">Enter a search term to get started.</p>
      <div id="search-results"></div>
      <noscript>Search requires JavaScript to be enabled.</noscript>
    </main>
    <footer-component></footer-component>
    <script src="components/nav-component.js"></script>
    <script src="components/footer-component.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/search.js"></script>
    <script src="components/footer-component.js" type="text/javascript"></script>
</body>
</html>
